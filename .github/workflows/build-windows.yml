name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Download dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git "$env:RUNNER_TEMP/JUCE"
          git clone --depth 1 https://github.com/aaronsgiles/ymfm.git "$env:RUNNER_TEMP/ymfm"
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_DIR=$env:RUNNER_TEMP/JUCE" "-DYMFM_DIR=$env:RUNNER_TEMP/ymfm"
      - name: Compile plugin
        run: cmake --build build --config Release --parallel 2
      - name: Package VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Filter '*.vst3' -Recurse | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $vst) { throw 'No VST3 bundle found' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Path $vst.FullName -Destination package -Recurse
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: CX5M-Reborn-v0.3-Experimental
          path: package/
          if-no-files-found: error
